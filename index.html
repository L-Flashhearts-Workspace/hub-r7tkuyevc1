<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Rwh Alliance — Weekly Tracker</title>
<style>
:root{
  --bg:#12151c; --surface:#1a1e28; --surface2:#222736; --line:#2e3444;
  --ink:#e7eaf0; --ink2:#9aa3b2; --ink3:#6b7383;
  --accent:#5b8def; --accent-soft:rgba(91,141,239,.16);
  --gold:#e5b84b; --warn:#e5b84b; --bad:#e06c75;
  --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:14px 12px 40px}
.wrap{max-width:1100px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:6px}
h1{font-size:19px;font-weight:700;letter-spacing:.2px}
h1 .tag{color:var(--accent)}
.sub{color:var(--ink2);font-size:12px;margin-bottom:12px}
.badge{display:inline-block;background:rgba(229,184,75,.15);color:var(--gold);border:1px solid rgba(229,184,75,.4);border-radius:999px;padding:2px 10px;font-size:11px;font-weight:700;letter-spacing:.5px;vertical-align:2px}
.langs{display:flex;gap:6px}
.langs button{background:var(--surface);border:1px solid var(--line);color:var(--ink2);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer}
.langs button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:12px 0 14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px}
.tile .k{color:var(--ink2);font-size:11px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
.tile .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.tile .v small{font-size:12px;color:var(--ink2);font-weight:400}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{background:var(--surface);border:1px solid var(--line);color:var(--ink2);border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer}
.tabs button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.pills button{background:var(--surface);border:1px solid var(--line);color:var(--ink2);border-radius:999px;padding:4px 12px;font-size:12px;cursor:pointer}
.pills button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:7px 10px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;border-bottom:1px solid var(--line);font-size:13px}
th{color:var(--ink2);font-size:11px;text-transform:uppercase;letter-spacing:.5px;position:sticky;top:0;background:var(--surface2);z-index:2}
td.name,th.name{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;max-width:180px;overflow:hidden;text-overflow:ellipsis}
th.name{background:var(--surface2);z-index:3}
td.rank,th.rank{text-align:center;color:var(--ink2);position:sticky;left:0;background:var(--surface);width:38px;min-width:38px;z-index:1}
th.rank{background:var(--surface2);z-index:3}
td.rank + td.name, th.rank + th.name{left:38px}
tr.dep td{color:var(--ink3)}
tr.dep td.name{color:var(--ink3)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(91,141,239,.07)}
tr:hover td.name, tr:hover td.rank{background:#212637}
.bar{position:relative}
.bar i{position:absolute;inset-inline-start:0;top:15%;height:70%;background:var(--accent-soft);border-radius:0 4px 4px 0;z-index:0}
[dir=rtl] .bar i{border-radius:4px 0 0 4px}
.bar b{position:relative;z-index:1;font-weight:600}
.top3 td.rank{color:var(--gold);font-weight:700}
.star{color:var(--gold)}
.foot{color:var(--ink2);font-size:12px;margin-top:10px;line-height:1.6}
.foot .star{margin-inline-end:2px}
.zero{color:var(--ink3)}
td.rt{font-weight:700;text-align:center}
td.rt.R1{color:#e06c75} td.rt.R2{color:#e5b84b} td.rt.R3{color:#7bc98a}
.rtile{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;border:1px solid;white-space:nowrap}
.rtile.R1{color:#e06c75;border-color:rgba(224,108,117,.5);background:rgba(224,108,117,.12)}
.rtile.R2{color:#e5b84b;border-color:rgba(229,184,75,.5);background:rgba(229,184,75,.12)}
.rtile.R3{color:#7bc98a;border-color:rgba(123,201,138,.5);background:rgba(123,201,138,.12)}
h2{font-size:15px;margin:16px 0 8px}
h2 .seas{color:var(--accent);font-weight:600}
.plink{cursor:pointer}
.plink:hover{color:var(--accent);text-decoration:underline}
.lseen{color:var(--ink3);font-size:11px;margin-inline-start:6px;text-transform:none;letter-spacing:0}
.search{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 12px;font-size:14px;margin-bottom:10px}
.search::placeholder{color:var(--ink3)}
.plist{display:flex;flex-wrap:wrap;gap:6px}
.plist button{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.plist button:hover{border-color:var(--accent);color:var(--accent)}
.plist button.depp{color:var(--ink3)}
.hint{color:var(--ink2);font-size:13px;margin:8px 0}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:10px}
.fgrp{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.fgrp>label{color:var(--ink2);font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-inline-end:2px}
.filters select,.filters input{background:var(--surface2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:5px 9px;font-size:13px}
.filters input{min-width:150px}
.filters input::placeholder{color:var(--ink3)}
.fbtn{background:var(--surface2);border:1px solid var(--line);color:var(--ink2);border-radius:999px;padding:4px 11px;font-size:12px;cursor:pointer}
.fbtn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600}
.fbtn.on.R1{background:rgba(224,108,117,.16);border-color:#e06c75;color:#e06c75}
.fbtn.on.R2{background:rgba(229,184,75,.16);border-color:#e5b84b;color:#e5b84b}
.fbtn.on.R3{background:rgba(123,201,138,.16);border-color:#7bc98a;color:#7bc98a}
.fcount{color:var(--ink2);font-size:12px;margin-inline-start:auto}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
th .sarrow{color:var(--accent);font-size:10px;margin-inline-start:3px}
td.up{color:#7bc98a} td.dn{color:#e06c75}
.chartwrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 6px 4px;margin-bottom:10px}
.chartwrap svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);padding:4px 8px 8px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:5px;vertical-align:-1px}
.dot.hollow{background:transparent;border:2px solid var(--warn)}
.note{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:8px 12px;margin-top:8px;font-size:13px;color:var(--ink2)}
.note b{color:var(--ink)}
.notice{background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--radius);padding:10px 13px;margin-bottom:12px;font-size:13px;color:var(--ink)}
.pname{font-size:18px;font-weight:700;margin:4px 0 2px}
.pstatus{font-size:12px;margin-bottom:10px}
.pstatus.cur{color:#7bc98a}
.pstatus.gone{color:var(--ink3)}
[dir=rtl] th,[dir=rtl] td{text-align:left}
[dir=rtl] td.name,[dir=rtl] th.name{text-align:right}
</style>
</head>

const FN = {"en":["The duel week runs Mon–Sat: the in-game Daily Rank tab has six day buttons (Mon–Sat) and no Sunday. Weekly Total − Saturday is therefore exactly Mon–Fri. Checked numerically — no player's Saturday exceeds their weekly total, and the Mon–Fri and Saturday totals add back to the weekly total to the point.","Ratings are scored on Mon–Fri, not the weekly total: R1 is 6,000,000 or less (did not meet required level), R2 is above 6,000,000 up to 8,000,000, R3 is above 8,000,000. This week: 22 in R1, 12 in R2, 64 in R3. The week ending 22 Aug has no rating — there was no Saturday capture to subtract, so it has no Mon–Fri figure.","Enemy Buster is the Saturday score — the same number under its in-game name, not a separate total. So Overall = Mon–Fri + Enemy Buster, and the three columns always reconcile. Ratings deliberately ignore Overall and Enemy Buster: they score Mon–Fri only, because that measures using resources at the right time for the alliance rather than raw account strength.","Week type is recorded as “Unknown”. This alliance does not run saving weeks yet, and week type is never inferred from scores.","Roster: 98 players, ranks 1–98 with no gaps or duplicates in either capture, and both captures hold the same 98 names. Joined this week: AtrisStar, BngBngSkeSke, IceBuffy, IceBuffy2, JEGR RANYA. Left: Aragorn7, EnglishTailor, Pestillo68, PvtGump, WildScrub. Two players were renamed and merged forward under the new name — khinan1910 → khinan1920 (same avatar, one digit apart) and ChrisGivesNoFox → ChrisHasNoShame (similar name and score, but the avatar changed, so treat this one as a best guess).","Read from the captures, not errors: JEGR RANYA, CRock187 scored only on Saturday, so their Mon–Fri is 0 and both land in R1. TogFARM, DEMONツBENDY scored 0 on the Saturday itself. Player names are shown exactly as they render in game and are never translated."],"de":["Die Duellwoche läuft Mo–Sa: der Reiter „Daily Rank“ hat sechs Tagesschalter (Mo–Sa) und keinen Sonntag. Wochensumme − Samstag ist daher exakt Mo–Fr. Numerisch geprüft — kein Samstagswert liegt über der Wochensumme, und Mo–Fr plus Samstag ergibt punktgenau die Wochensumme.","Die Bewertungen beziehen sich auf Mo–Fr, nicht auf die Wochensumme: R1 bis 6.000.000 (Anforderung nicht erfüllt), R2 über 6.000.000 bis 8.000.000, R3 über 8.000.000. Diese Woche: 22 in R1, 12 in R2, 64 in R3. Die Woche zum 22. Aug hat keine Bewertung — ohne Samstagserfassung gibt es dort keinen Mo–Fr-Wert.","Enemy Buster ist der Samstagswert — dieselbe Zahl unter ihrem Spielnamen, keine separate Summe. Also Gesamt = Mo–Fr + Enemy Buster, und die drei Spalten stimmen immer überein. Die Bewertungen ignorieren Gesamt und Enemy Buster bewusst: sie bewerten nur Mo–Fr, weil das misst, ob Ressourcen zur richtigen Zeit für die Allianz eingesetzt werden — nicht die Stärke des Kontos.","Der Wochentyp ist als „Unbekannt“ erfasst. Diese Allianz führt noch keine Sparwochen, und der Wochentyp wird niemals aus den Punkten abgeleitet.","Kader: 98 Spieler, Ränge 1–98 in beiden Aufnahmen ohne Lücken oder Duplikate, und beide enthalten dieselben 98 Namen. Neu: AtrisStar, BngBngSkeSke, IceBuffy, IceBuffy2, JEGR RANYA. Ausgetreten: Aragorn7, EnglishTailor, Pestillo68, PvtGump, WildScrub. Zwei Spieler wurden umbenannt und unter dem neuen Namen zusammengeführt — khinan1910 → khinan1920 (gleiches Bild, eine Ziffer Unterschied) und ChrisGivesNoFox → ChrisHasNoShame (ähnlicher Name und Punktestand, aber das Bild wechselte — eine begründete Vermutung).","Aus den Aufnahmen gelesen, keine Fehler: JEGR RANYA, CRock187 haben nur am Samstag gepunktet, ihr Mo–Fr ist also 0 und beide landen in R1. TogFARM, DEMONツBENDY haben am Samstag selbst 0 erzielt. Spielernamen erscheinen exakt wie im Spiel und werden nie übersetzt."],"tr":["Düello haftası Pzt–Cmt sürer: oyundaki Daily Rank sekmesinde altı gün düğmesi (Pzt–Cmt) vardır, Pazar yoktur. Bu nedenle Haftalık Toplam − Cumartesi tam olarak Pzt–Cum'dur. Sayısal olarak doğrulandı — hiçbir oyuncunun cumartesi puanı haftalık toplamını aşmıyor ve Pzt–Cum ile Cumartesi toplamları haftalık toplama birebir eşit.","Değerlendirmeler haftalık toplama göre değil Pzt–Cum'a göre yapılır: R1 6.000.000 ve altı (gerekli seviyeye ulaşılamadı), R2 6.000.000 üzeri–8.000.000, R3 8.000.000 üzeri. Bu hafta: R1'de 22, R2'de 12, R3'te 64. 22 Ağu haftasının değerlendirmesi yok — çıkarılacak cumartesi kaydı olmadığından Pzt–Cum değeri de yok.","Enemy Buster, cumartesi puanıdır — oyundaki adıyla aynı sayı, ayrı bir toplam değil. Yani Genel toplam = Pzt–Cum + Enemy Buster ve üç sütun her zaman birbirini tutar. Değerlendirmeler Genel toplamı ve Enemy Buster'ı bilerek yok sayar; yalnızca Pzt–Cum'u puanlar, çünkü ölçülen şey hesap gücü değil, kaynakların ittifak için doğru zamanda kullanılmasıdır.","Hafta türü “Bilinmiyor” olarak kaydedildi. Bu ittifak henüz biriktirme haftası uygulamıyor ve hafta türü asla puanlardan çıkarılmaz.","Kadro: 98 oyuncu, her iki kayıtta da 1–98 sıraları boşluksuz ve tekrarsız; iki kayıt da aynı 98 ismi içeriyor. Bu hafta katılanlar: AtrisStar, BngBngSkeSke, IceBuffy, IceBuffy2, JEGR RANYA. Ayrılanlar: Aragorn7, EnglishTailor, Pestillo68, PvtGump, WildScrub. İki oyuncu yeniden adlandırıldı ve yeni adları altında birleştirildi — khinan1910 → khinan1920 (aynı avatar, tek rakam farkı) ve ChrisGivesNoFox → ChrisHasNoShame (benzer ad ve puan, ancak avatar değişti; bu bir tahmin).","Kayıtlardan okundu, hata değil: JEGR RANYA, CRock187 yalnızca cumartesi puan aldı, bu yüzden Pzt–Cum değerleri 0 ve ikisi de R1'de. TogFARM, DEMONツBENDY cumartesi günü 0 puan aldı. Oyuncu adları oyunda göründüğü gibi yazılır ve asla çevrilmez."]};

const W = DATA.weeks, NW = W.length, LI = NW-1;
const WM = {}; DATA.weekMeta.forEach(m=>WM[m.d]=m);
const NOSAT = new Set((DATA.noSat||[]).map(d=>W.indexOf(d)));
const ESTW  = new Set((DATA.estW||[]).map(d=>W.indexOf(d)));
const IRREG = new Set((DATA.irregular||[]).map(d=>W.indexOf(d)));
const SEASONS = [...new Set(DATA.weekMeta.map(m=>m.season))];
const LEAGUES = DATA.leagues||[];
const HAS_SAT = DATA.players.some(p=>Object.values(p.wk).some(c=>c[1]!=null));

const FDEF = {week:'all', rating:'all', member:'all', shape:'all', wtype:'all', min:'', max:'', q:''};
let state = {lang:CFG.langs[0], tab:0, league:LEAGUES[LEAGUES.length-1],
             season:SEASONS[SEASONS.length-1], event:0, player:null, q:'',
             f:{...FDEF}, sort:{col:'m', dir:-1}};

const $ = id => document.getElementById(id);
const t = () => L[state.lang];
const fmt = n => n==null||n===''?t().noData:new Intl.NumberFormat(t().nf).format(Math.round(n));
const loc = () => t().nf;
const fcompact = n => new Intl.NumberFormat(loc(),{notation:'compact',maximumFractionDigits:1}).format(n);
const fdate = s => new Intl.DateTimeFormat(loc(),{day:'numeric',month:'short',year:'numeric'}).format(new Date(s+'T00:00:00'));
const fdateShort = s => new Intl.DateTimeFormat(loc(),{day:'numeric',month:'short'}).format(new Date(s+'T00:00:00'));
const fmon = (s,y) => new Intl.DateTimeFormat(loc(),y?{month:'short',year:'numeric'}:{month:'short'}).format(new Date(s+'T00:00:00'));
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const wkMark = i => (ESTW.has(i)?'*':'') + (NOSAT.has(i)?'**':'') + (IRREG.has(i)?'***':'');

// The one place the headline metric is defined.
// True Week - Saturday. Null whenever Saturday was not captured - never
// silently falls back to the weekly total.
const wksat = c => (!c || c[1]==null) ? null : c[0]-c[1];
// The ranking metric, chosen by config.
const val = c => { if(!c) return null;
  return CFG.metric==='wksat' ? wksat(c) : c[0]; };
const metricLabel = () => t()[CFG.metricLabel] || (CFG.metric==='wksat' ? t().wksat : t().weekly);
const BANDS = DATA.bands || null;
const isSaving = wi => (WM[W[wi]]||{}).type === 'Saving';
const isNormal = wi => (WM[W[wi]]||{}).type === 'Normal';
// Saving weeks are never rated: points are banked, so a low score is not a
// low effort. Ratings only ever describe a non-saving week.
const bandOf = (v, wi) => (!BANDS || v==null || (wi!=null && isSaving(wi)))
  ? null : (v<=BANDS.r1max?'R1':(v<=BANDS.r2max?'R2':'R3'));
const eligibleWeeks = () => {
  const all = W.map((d,i)=>i);
  return state.f.wtype==='normal' ? all.filter(isNormal) : all;
};

const pWeeks = p => Object.keys(p.wk).map(Number).sort((a,b)=>a-b);
const last = p => { const w=pWeeks(p); return w[w.length-1]; };

function plink(p, extra){
  const i = DATA.players.indexOf(p);
  return `<span class="plink" data-pi="${i}">${esc(p.n)}</span>${p.jn?' <span class="star">★</span>':''}${extra||''}`;
}
function stats(p){
  const ws = pWeeks(p);
  let total=0, elig=[];
  ws.forEach(i=>{ const d=val(p.wk[i]); if(d==null) return;
    total+=d; if(!NOSAT.has(i) && !ESTW.has(i)) elig.push([i,d]); });
  let avg=null,best=null,worst=null;
  if(elig.length){
    avg = elig.reduce((s,e)=>s+e[1],0)/elig.length;
    best = elig.reduce((a,b)=>b[1]>a[1]?b:a);
    worst = elig.reduce((a,b)=>b[1]<a[1]?b:a);
  }
  return {n:ws.length, total, avg, best, worst, first:ws[0], last:ws[ws.length-1], pts:elig.length};
}

function render(){
  const tr = t();
  document.documentElement.lang = state.lang;
  document.body.dir = tr.dir;
  $('t-title').textContent = tr.title;
  const weeksPhrase = (NW===1 ? tr.weeks1 : tr.weeksN.replace('{n}', fmt(NW)));
  const range = (W[0]===DATA.latest) ? fdate(W[0]) : fdate(W[0]) + ' – ' + fdate(DATA.latest);
  $('t-sub').textContent = tr.sub
    .replace('{metric}', metricLabel())
    .replace('{weeks}', weeksPhrase)
    .replace('{range}', range)
    .replace('{date}', fdate(DATA.generated));
  const meta = WM[DATA.latest];
  const b = $('badge');
  if(meta.type==='Saving'){ b.style.display='inline-block'; b.textContent = tr.saving; } else b.style.display='none';

  $('langs').innerHTML = CFG.langs.map(k=>
    `<button class="${k===state.lang?'on':''}" onclick="setLang('${k}')">${L[k].lab}</button>`).join('');

  const cur = currentRows();
  const total = cur.reduce((s,r)=>s+r.w,0);
  const totalD = cur.reduce((s,r)=>s+(r.d==null?0:r.d),0);
  const tiles = [
    [tr.latest, fdate(DATA.latest)],
    [tr.type, meta.type==='Saving'?tr.tSaving:(meta.type==='Normal'?tr.tNormal:tr.tUnknown)],
    [tr.playersN, fmt(cur.length)],
    [tr.allTotal, fmt(total)],
  ];
  if(HAS_SAT) tiles.push([tr.totalOf.replace('{metric}', metricLabel()), fmt(totalD) + (ESTW.has(LI)?'*':'')]);
  else tiles.push([tr.rankedBy, `<span style="font-size:15px">${metricLabel()}</span>`]);
  if(CFG.bands){
    const bc={R1:0,R2:0,R3:0};
    cur.forEach(r=>{const b=bandOf(r.d, LI); if(b) bc[b]++;});

  }
  tiles.push([tr.weeksTracked, fmt(NW)], [tr.playersAllTime, fmt(DATA.players.length)]);
  $('tiles').innerHTML = tiles.map(([k,v])=>`<div class="tile"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');

  $('tabs').innerHTML = CFG.tabs.map((key,i)=>
    `<button class="${i===state.tab?'on':''}" onclick="setTab(${i})">${tr.tabs[key]}</button>`).join('');

  const key = CFG.tabs[state.tab];
  const v = $('view');
  if(key==='overview')      v.innerHTML = overviewHTML();
  else if(key==='history')  v.innerHTML = historyHTML();
  else if(key==='player')   v.innerHTML = playerHTML();
  else if(key==='league')   v.innerHTML = leaguesHTML();
  else if(key==='season')   v.innerHTML = seasonHTML();
  else if(key==='events')   v.innerHTML = eventsHTML();

  const anyMarks = DATA.players.some(p=>p.jn||p.dep);
  let foot = (anyMarks ? tr.legend + ' · ' : '') + tr.clickHint;
  if(CFG.bands) foot = `<span class="rtile R1">${tr.bandR1}</span> <span class="rtile R2">${tr.bandR2}</span> <span class="rtile R3">${tr.bandR3}</span><br>` + foot;
  if(meta.type==='Saving') foot += '<br>' + tr.savingLong;
  const joins = DATA.players.filter(p=>p.jn && last(p)>=LI-1).map(p=>`<span class="star">★</span>${esc(p.n)} — ${tr.joined.replace('{date}',fdateShort(p.jn))}`);
  const deps  = DATA.players.filter(p=>p.dep && last(p)>=LI-1).map(p=>`${esc(p.n)} — ${p.snap?tr.snapshot:tr.left}`);
  if(joins.length) foot += '<br>' + joins.join(' · ');
  if(deps.length)  foot += '<br>' + deps.join(' · ');
  const fns = (FN[state.lang]||FN.en);
  if(fns.length) foot += '<hr style="border:none;border-top:1px solid var(--line);margin:8px 0">' + fns.join('<br>');
  $('foot').innerHTML = foot;

  if(state._search){ const el=$('psearch'); if(el){ el.value=state.q; el.focus(); const n=el.value.length; el.setSelectionRange(n,n);} state._search=false; }
  if(state._fsearch){ const el=$('fq'); if(el){ el.focus(); const n=el.value.length; el.setSelectionRange(n,n);} state._fsearch=false; }
  if(CFG.tabs[state.tab]==='overview') syncHash();
}

function currentRows(){
  return DATA.players
    .filter(p=>p.wk[LI] && !p.dep)
    .map(p=>({p, w:p.wk[LI][0], s:p.wk[LI][1], d:wksat(p.wk[LI]), m:val(p.wk[LI])}))
    .sort((a,b)=>(b.m==null?-Infinity:b.m)-(a.m==null?-Infinity:a.m));
}

// Week columns run NEWEST FIRST, left to right.
// The latest week is skipped - it is already the headline column - and so are
// weeks where no player has a value for the headline metric.
const weekHasMetric = i => DATA.players.some(p=>val(p.wk[i])!=null);
function recentWeeks(n, wi){
  const elig = new Set(eligibleWeeks());
  const out=[];
  for(let i=NW-1;i>=0 && out.length<n;i--)
    if(i!==wi && elig.has(i) && weekHasMetric(i)) out.push(i);
  return out;
}

function colName(key, fallback){
  const k = (CFG.colNames||{})[key];
  return (k && t()[k]) ? t()[k] : fallback;
}

function buildRows(wi){
  return DATA.players.map(p=>{
    const c = p.wk[wi] || null;
    const prev = wi>0 ? (p.wk[wi-1]||null) : null;
    const m = val(c), pm = val(prev);
    return {p, present:!!c,
            w: c?c[0]:null, s: c?c[1]:null, m,
            delta: (m!=null && pm!=null) ? m-pm : null,
            dep: !!p.dep, jn: !!p.jn, rating: bandOf(m, wi)};
  });
}

function applyFilters(rows){
  const f = state.f, q = f.q.trim().toLowerCase();
  const mn = f.min===''?null:+f.min, mx = f.max===''?null:+f.max;
  return rows.filter(r=>{
    if(!r.present){
      if(!r.dep) return false;
      if(f.member==='current' || f.member==='new') return false;
      if(f.rating!=='all' || f.shape!=='all' || mn!=null || mx!=null) return false;
    }
    if(f.rating!=='all' && r.rating!==f.rating) return false;
    if(f.member==='current'  && r.dep) return false;
    if(f.member==='departed' && !r.dep) return false;
    if(f.member==='new'      && !r.jn) return false;
    if(f.shape==='satonly'   && !(r.m===0 && r.s>0)) return false;
    if(mn!=null && !(r.m!=null && r.m>=mn)) return false;
    if(mx!=null && !(r.m!=null && r.m<=mx)) return false;
    if(q && !r.p.n.toLowerCase().includes(q) && !(r.p.rn||'').toLowerCase().includes(q)) return false;
    return true;
  });
}

function sortRows(rows){
  const key = state.sort.col, dir = state.sort.dir;
  rows.sort((a,b)=>{
    if(key==='n') return dir * a.p.n.localeCompare(b.p.n);
    if(key.slice(0,3)==='wk:'){                 // sort by a past week's score
      const k=+key.slice(3), av=val(a.p.wk[k]), bv=val(b.p.wk[k]);
      if(av==null && bv==null) return 0;
      if(av==null) return 1;
      if(bv==null) return -1;
      return dir * (av-bv);
    }
    if(key==='rating'){ const o={R1:1,R2:2,R3:3};
      return dir * ((o[a.rating]||0)-(o[b.rating]||0)); }
    const av=a[key], bv=b[key];
    if(av==null && bv==null) return 0;
    if(av==null) return 1;
    if(bv==null) return -1;
    return dir * (av-bv);
  });
  rows.sort((a,b)=>(a.present?0:1)-(b.present?0:1));
  return rows;
}

function visibleRows(){
  const elig = eligibleWeeks();
  let wi;
  if(state.f.week!=='all' && elig.includes(+state.f.week)) wi = +state.f.week;
  else wi = elig.length ? elig[elig.length-1] : null;
  if(wi==null) return {wi:null, rows:[]};
  return {wi, rows: sortRows(applyFilters(buildRows(wi)))};
}

  DATA.weekMeta.forEach(m=>{ if(m.hist && !periods.includes(m.period)) periods.push(m.period); });

  [...periods].reverse().forEach(per=>{
    const wis = []; DATA.weekMeta.forEach((m,i)=>{ if(m.hist && m.period===per) wis.push(i); });
    wis.reverse();                                   // newest first
    const seasons = [...new Set(wis.map(i=>DATA.weekMeta[i].season))];
    const lbl = fmon(per.slice(0,10)) + ' – ' + fmon(per.slice(-10), true);
    const rows = DATA.players.map(p=>{
      let tot=0,n=0; wis.forEach(i=>{ const d=val(p.wk[i]); if(d!=null){ tot+=d; n++; } });
      return {p, tot, n};
    }).filter(r=>r.n>0).sort((a,b)=>b.tot-a.tot);
    h += `<h2>${lbl} <span class="seas">${seasons.join(' – ')}</span></h2>
      <div class="tblwrap"><table><thead><tr>
      <th class="rank">${tr.rank}</th><th class="name">${tr.player}</th><th>${tr.histTotal}</th>` +
      wis.map(i=>`<th>${fdateShort(W[i])}${wkMark(i)}</th>`).join('') + `</tr></thead><tbody>`;
    rows.forEach((r,i)=>{

function playerHTML(){

  if(p.snap) h += `<div class="note">${tr.snapshot}</div>`;
  else if(p.dep) h += `<div class="note">${tr.left}</div>`;
  return h;
}

function chartSVG(p, st){
  const tr = t();
  const Wd=880, Hd=320, ml=64, mr=16, mt=16, mb=42;
  const iw=Wd-ml-mr, ih=Hd-mt-mb;
  const pts = pWeeks(p).map(i=>({i, d:val(p.wk[i])})).filter(q=>q.d!=null);
  const vals = pts.map(q=>q.d);
  let lo = Math.min(0, ...vals), hi = Math.max(...vals, st.avg||0);
  if(hi===lo) hi = lo+1;
  const pad=(hi-lo)*0.08; hi+=pad; lo=Math.min(0,lo);
  const X = i => ml + (NW===1?iw/2:i/(NW-1)*iw);
  const Y = d => mt + ih - (d-lo)/(hi-lo)*ih;
  let s = `<div class="chartwrap" dir="ltr"><svg viewBox="0 0 ${Wd} ${Hd}" role="img">`;
  const nt=4;
  for(let k=0;k<=nt;k++){
    const v2 = lo + (hi-lo)*k/nt, y = Y(v2);
    s += `<line x1="${ml}" x2="${Wd-mr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`;
    s += `<text x="${ml-8}" y="${y+4}" text-anchor="end" font-size="11" style="fill:var(--ink2)">${fcompact(v2)}</text>`;
  }
  const step = Math.max(1, Math.ceil(NW/7));
  for(let i=0;i<NW;i+=step){
    s += `<text x="${X(i)}" y="${Hd-10}" text-anchor="middle" font-size="10" style="fill:var(--ink2)">${fdateShort(W[i])}</text>`;
  }
  if(st.avg!=null){
    const y=Y(st.avg);
    s += `<line x1="${ml}" x2="${Wd-mr}" y1="${y}" y2="${y}" stroke="var(--ink2)" stroke-width="1.5" stroke-dasharray="6 5"/>`;
    s += `<text x="${Wd-mr-4}" y="${y-6}" text-anchor="end" font-size="11" style="fill:var(--ink2)">${tr.avg} ${fcompact(st.avg)}</text>`;
  }
  // Gaps in membership break the line rather than dropping to zero.
  let seg=[];
  const flush=()=>{ if(seg.length>1) s += `<polyline fill="none" stroke="var(--accent)" stroke-width="2" points="${seg.map(q=>X(q.i)+','+Y(q.d)).join(' ')}"/>`; seg=[]; };
  pts.forEach((q,k)=>{ if(k>0 && pts[k-1].i !== q.i-1) flush(); seg.push(q); });
  flush();
  pts.forEach(q=>{
    const isB = st.best && q.i===st.best[0] && q.d===st.best[1];
    const isW = st.worst && q.i===st.worst[0] && q.d===st.worst[1];
    let fill='var(--accent)', stroke='none', r=3.2;
    if(ESTW.has(q.i)){ fill='var(--bg)'; stroke='var(--accent)'; r=4.2; }
    if(NOSAT.has(q.i)){ fill='var(--bg)'; stroke='var(--warn)'; r=4.2; }
    if(isB){ fill='var(--gold)'; r=5; }
    if(isW){ fill='var(--bad)'; r=5; }
    s += `<circle cx="${X(q.i)}" cy="${Y(q.d)}" r="${r}" fill="${fill}" ${stroke!=='none'?`stroke="${stroke}" stroke-width="2"`:''}>`+
      `<title>${fdate(W[q.i])}${wkMark(q.i)}: ${fmt(q.d)}</title></circle>`;
  });
  return s + `</svg></div>`;
}

function agg(filterFn){
  const m = new Map();
  DATA.players.forEach(p=>{
    Object.keys(p.wk).forEach(k=>{
      const i=+k, wdate=W[i];
      if(!filterFn(wdate)) return;
      const d=val(p.wk[i]); if(d==null) return;
      let e = m.get(p);
      if(!e){ e={all:0,excl:0,n:0}; m.set(p,e); }
      e.all += d; e.n += 1;
      if(WM[wdate].type==='Normal') e.excl += d;
    });
  });
  return [...m.entries()].map(([p,e])=>({p,...e})).sort((a,b)=>b.all-a.all);
}

  const tr = t();

  rows.forEach((r,i)=>{
    h += `<tr class="${i<3?'top3':''}"><td class="rank">${i+1}</td><td class="name">${plink(r.p)}</td>
      <td>${fmt(r.all)}</td>${ex?`<td class="${r.excl?'':'zero'}">${r.excl?fmt(r.excl):tr.noData}</td>`:''}<td>${fmt(r.n)}</td></tr>`;
  });
  return h + '</tbody></table></div>';
}

function eventsHTML(){
  const tr = t();
  if(!DATA.events || !DATA.events.length) return `<div class="hint">${tr.noData}</div>`;
  const ev = DATA.events[state.event];
  const pills = `<div class="pills">` + DATA.events.map((e,i)=>
    `<button class="${i===state.event?'on':''}" onclick="setEvent(${i})">${esc(e.name)} · ${fdateShort(e.date)}</button>`).join('') + `</div>`;
  const byName = {}; DATA.players.forEach(p=>byName[p.n]=p);
  const nm = n => byName[n] ? plink(byName[n]) : esc(n);
  const rows = [...ev.rows].sort((a,b)=>b.sc-a.sc);
  const max = Math.max(...rows.map(r=>r.sc));
  let h = `<div class="tblwrap"><table><thead><tr>
    <th class="rank">${tr.rank}</th><th class="name">${tr.player}</th><th>${tr.score}</th></tr></thead><tbody>`;
  rows.forEach((r,i)=>{
    const pct = max&&r.sc? Math.max(2,r.sc/max*100):0;
    h += `<tr class="${i<3&&r.sc?'top3':''} ${r.sc?'':'dep'}"><td class="rank">${r.sc?i+1:'–'}</td>
      <td class="name">${nm(r.p)}${r.n?' <span class="star">★</span>':''}</td>
      <td class="bar"><i style="width:${pct}%"></i><b>${r.sc?fmt(r.sc):tr.evMissed}</b></td></tr>`;
  });
  h += '</tbody></table></div>';
  const m = {};
  DATA.events.forEach(e=>e.rows.forEach(r=>{
    const x = m[r.p] = m[r.p]||{pts:0,sc:0,ms:0,tot:0};
    x.pts += r.sc; x.tot += 1; r.sc>0 ? x.sc++ : x.ms++;
  }));
  const srows = Object.entries(m).map(([name,x])=>({name,...x})).sort((a,b)=>b.pts-a.pts);
  let h2 = `<h2>${tr.evPts}</h2><div class="tblwrap"><table><thead><tr>
    <th class="rank">${tr.rank}</th><th class="name">${tr.player}</th>
    <th>${tr.evPts}</th><th>${tr.evScored}</th><th>${tr.evMissed}</th><th>${tr.evTotal}</th></tr></thead><tbody>`;
  srows.forEach((r,i)=>{
    h2 += `<tr class="${i<3?'top3':''}"><td class="rank">${i+1}</td><td class="name">${nm(r.name)}</td>
      <td>${fmt(r.pts)}</td><td>${fmt(r.sc)}</td><td class="${r.ms?'':'zero'}">${fmt(r.ms)}</td><td>${fmt(r.tot)}</td></tr>`;
  });
  return pills + h + h2 + '</tbody></table></div>';
}

function setLang(k){state.lang=k;render();}
function setTab(i){ if(CFG.tabs[i]==='player' && CFG.tabs[state.tab]==='player') state.player=null; state.tab=i; render(); }
function clearPlayer(){state.player=null;render();}
function setLeague(lg){state.league=lg;render();}
function setSeason(sn){state.season=sn;render();}
function setEvent(i){state.event=i;render();}
function setQ(v){state.q=v;state._search=true;render();}
function setF(k,v){state.f[k]=v;render();}
function setFQ(v){state.f.q=v;state._fsearch=true;render();}
function resetF(){state.f={...FDEF};state.sort={col:'m',dir:-1};render();}
function setSort(c){ if(state.sort.col===c) state.sort.dir*=-1;
  else state.sort={col:c, dir:(c==='n'?1:-1)}; render(); }
function setFN(k,v){state.f[k]=v;render();}
function preset(k){
  state.f={...FDEF};
  if(k==='coach')   { state.f.rating='R1'; state.f.member='current'; state.sort={col:'m',dir:-1}; }
  if(k==='satonly') { state.f.shape='satonly'; state.sort={col:'w',dir:-1}; }
  if(k==='new')     { state.f.member='new'; state.sort={col:'m',dir:-1}; }
  if(k==='fallers') { state.f.member='current'; state.sort={col:'delta',dir:1}; }
  render();
}
function flash(id, msg){
  const el=$(id); if(!el) return;
  const old=el.textContent; el.textContent=msg; el.classList.add('on');
  setTimeout(()=>{el.textContent=old; el.classList.remove('on');}, 1400);
}
function toClipboard(text, id, msg){
  const done = ()=>flash(id,msg);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback());
  } else fallback();
  function fallback(){
    const ta=document.createElement('textarea');
    ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){}
    document.body.removeChild(ta);
  }
}
function copyList(){
  const tr=t(); const {wi, rows}=visibleRows();
  const head = `${CFG.tag} ${fdate(W[wi])} - ${metricLabel()}`;
  const body = rows.filter(r=>r.present).map((r,i)=>
    `${i+1}. ${r.p.n} - ${fmt(r.m)}${r.rating?' ('+r.rating+')':''}`).join('\n');
  toClipboard(head+'\n'+body, 'cbtn', tr.fCopied);
}
function copyLink(){
  toClipboard(location.origin+location.pathname+hashOf(), 'lbtn', t().fLinked);
}
function hashOf(){
  const f=state.f, so=state.sort, parts=[];
  if(f.week!=='all')   parts.push('w='+f.week);
  if(f.rating!=='all') parts.push('r='+f.rating);
  if(f.member!=='all') parts.push('m='+f.member);
  if(f.shape!=='all')  parts.push('sh='+f.shape);
  if(f.wtype!=='all')  parts.push('wt='+f.wtype);
  if(f.min!=='')       parts.push('min='+f.min);
  if(f.max!=='')       parts.push('max='+f.max);
  if(f.q)              parts.push('q='+encodeURIComponent(f.q));
  if(so.col!=='m'||so.dir!==-1) parts.push('s='+so.col+(so.dir<0?'d':'a'));
  if(state.lang!==CFG.langs[0]) parts.push('l='+state.lang);
  return parts.length? '#'+parts.join('&') : '';
}
function readHash(){
  const h=(location.hash||'').replace(/^#/,''); if(!h) return;
  const kv={}; h.split('&').forEach(x=>{const i=x.indexOf('='); if(i>0) kv[x.slice(0,i)]=x.slice(i+1);});
  if(kv.w!=null)  state.f.week=kv.w;
  if(kv.r)        state.f.rating=kv.r;
  if(kv.m)        state.f.member=kv.m;
  if(kv.sh)       state.f.shape=kv.sh;
  if(kv.wt)       state.f.wtype=kv.wt;
  if(kv.min!=null)state.f.min=kv.min;
  if(kv.max!=null)state.f.max=kv.max;
  if(kv.q)        state.f.q=decodeURIComponent(kv.q);
  if(kv.s)        state.sort={col:kv.s.slice(0,-1), dir:kv.s.endsWith('d')?-1:1};
  if(kv.l && CFG.langs.includes(kv.l)) state.lang=kv.l;
}
function syncHash(){ try{ history.replaceState(null,'',hashOf()||location.pathname); }catch(e){} }
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-pi]');
  if(!el) return;
  state.player = +el.dataset.pi;
  state.tab = CFG.tabs.indexOf('player');
  render();
  window.scrollTo({top:0});
});
try{ readHash(); }catch(e){}
render();

</script>
